name: Transformer Atlas Browser Smoke
on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start site server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/atlas-server.log 2>&1 &
      - name: Parse JavaScript and run headless browser tests
        run: |
          node --check app.js
          node --check data.js
          node tests/smoke.mjs
      - name: Upload 3D preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-smoke-preview
          path: |
            atlas-smoke.png
            marshalling-cabinet-smoke.png
          if-no-files-found: ignore
